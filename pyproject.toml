[tool.black]
target-version = ['py312', 'py313', 'py314']
force-exclude = '''
(
  /(
      \.git
      | data
  )/
)
'''

[build-system]
requires = [
    "setuptools>=70",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = 'lis2'
version = "1.1.0"
license = "BSD-3-Clause"
dynamic = ["dependencies"]
requires-python = '>=3.12'
description = "LIS² (Large Image Split Segmentation): A toolbox for large-scale, single-image semantic segmentation"

authors = [
    {name = "Loris Berthelot"},
    {name = "Dominique Benielli", email = "dominique.benielli@univ-amu.fr"},
    {name = "François-Xavier Dupé", email = "francois-xavier.dupe@univ-amu.fr" },
    {name = "Caroline de Pourtales"},
    {name = "Elliot Maitre"},
    {name = "Thierry Artières"},
    {name = "Annie Zavagno"},
    {name = "Julien Rabault"}
]

classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Astronomy"
]
readme = {file = "README.md", content-type = "text/markdown"}

keywords = ['machine learning, supervised learning, classification, ensemble methods, boosting, kernel']

[project.urls]
"Sources" = "https://github.com/multi-learn/lis2"
Documentation  = "https://multi-learn.github.io/lis2/"
"Bug Tracker" = "https://github.com/multi-learn/lis2/issues"

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
cu132 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
exclude= ["tests"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu132" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--cov=lis2",
]

[tool.isort]
profile = "black"
combine_as_imports = true
line_length = 88
force_sort_within_sections = true
skip = ["data", ]

[tool.flake8]
docstring-convention = "numpy"
max-line-length = 88

# space before : (needed for how black formats slicing)
# line break before binary operator
ignore = [
    "E203",
    "W503",
]
exclude = [
    "tests/*.py",
]
# excluded because flake requires docstrings for tests, included for black

[dependency-groups]
doc = [
    "sphinx>=5.0",
    "sphinx-autoapi",
    "numpydoc",
    "sphinx_gallery",
    "matplotlib",
    "sphinx_rtd_theme",
]
dev = [
    "pytest >= 7.0",
    "pytest-cov >= 3.0",
    "coverage >= 6.0",
    "sphinx >= 6.0",
    "sphinx-autoapi >= 2.0",
    "tox >= 4.0",
    "black >= 24.4.0",
    "pre-commit >= 3.2.0",
    "Flake8-pyproject>=1.2.0",
]

[tool.coverage.run]
branch = true
omit = [
    "*/.local/*",
    "/usr/*",
    "tests/*",
    ]

[coverage.report]
show_missing = true
skip_covered = true
