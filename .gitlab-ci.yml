



# GitLab CI - LIS2
image: python:${PYTHON_VERSION}

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "uv-${PYTHON_VERSION}"
  paths:
    - .uv-cache/

stages:
  - build
  - test
  - deploy

# --------------------------------------------------
# Build package
# --------------------------------------------------

build-job:
  stage: build
  image: python:3.12
  variables:
    PYTHON_VERSION: "3.12"
  before_script:
    - pip install uv
    - uv --version
    - python --version
  script:
    - uv build --wheel
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week

# --------------------------------------------------
# Python tests + coverage
# --------------------------------------------------

test-python:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  before_script:
    - pip install uv
    - uv --version
    - python --version
    - uv sync --group dev
  script:
    - uv run --no-sync pytest
        --cov=lis2
        --cov-report=term
        --cov-report=xml:coverage.xml
        --cov-report=html:htmlcov
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --------------------------------------------------
# Documentation / GitLab Pages
# --------------------------------------------------

pages:
  stage: deploy
  image: python:3.12
  before_script:
    - pip install uv
    - uv --version
    - uv sync --group doc
  script:
    - uv run --no-sync sphinx-apidoc -M -f -o docs/source/generated --implicit-namespaces lis2
    - uv run sphinx-build -M html docs/source/ docs/build/
    - mkdir -p public
    - cp -r docs/build/html/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


