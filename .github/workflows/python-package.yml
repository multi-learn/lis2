name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published] 

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra cpu --group dev 

      - name: Lint with flake8
        run: |
          uv run --no-sync flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          uv run --no-sync flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics
      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest \
            --cov=lis2 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: success() && matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build distribution
        run: uv build --no-sync--out-dir dist/

      - name: Check distribution
        run: |
          uvx twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/

  publish-build:
    name: Build and publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/lis2/

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check version against release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(uv version --short)
          TAG_VERSION="${RELEASE_TAG#v}"

          echo "Package version: $VERSION"
          echo "Release tag: $TAG_VERSION"

          test "$VERSION" = "$TAG_VERSION"

      - name: Build distribution
        run: uv build --out-dir dist/

      - name: Check distribution
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist
